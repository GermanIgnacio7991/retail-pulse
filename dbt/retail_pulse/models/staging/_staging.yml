version: 2

models:
  - name: stg_orders
    description: Una fila por orden.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_users')
              field: user_id
      - name: estado
        tests:
          - accepted_values:
              values: ['processing', 'shipped', 'complete', 'cancelled', 'returned']

  - name: stg_order_items
    description: Una fila por producto dentro de una orden.
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
              config:
                severity: warn   # ítems y órdenes pueden tener timestamps distintos en el borde de hoy
      - name: product_id
        tests:
          - relationships:
              to: ref('stg_products')
              field: product_id

  - name: stg_users
    columns:
      - name: user_id
        tests: [unique, not_null]

  - name: stg_products
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: stg_indicadores
    columns:
      - name: fecha
        tests: [unique, not_null]
